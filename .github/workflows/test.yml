# 올릴 때마다 자동 검사: 시뮬레이션(짧게)과 화면 검사
name: test
on:
  push:
    branches: [main]
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: for f in js/*.js sw.js test/*.js test/browser/*.js; do node --check "$f"; done
      - run: node test/sim.js 1000 --seed=1
      - run: node test/tactics.js 300 16
      - run: node test/pacing.js 40
      - run: node test/browser/run.js
      - run: node test/browser/update-chain.js
